[project]
name = "rss-reader"
version = "2.0.0"
description = "RSS podcast reader CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.scripts]
rss-reader = "rss_reader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rss_reader"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
